# GitHub Actions — ingyenes iOS-ellenőrzés Apple Developer fiók NÉLKÜL
#
# Mit bizonyít ez a workflow?
#   1. a Dart-kód elemzése tiszta (`flutter analyze`),
#   2. az iOS-projekt LEFORDUL (`flutter build ios --no-codesign`) — vagyis a
#      Podfile, a pluginok és a deployment target rendben vannak,
#   3. a tesztkészlet zöld macOS-en is.
#
# Mit NEM tud? Aláírt .ipa-t és TestFlightot — ahhoz Apple Developer Program
# tagság kell. Az a lépés a Codemagicben van (codemagic.yaml).
#
# SORREND SZÁNDÉKOS: a lépések úgy vannak sorba állítva, hogy a workflow
# LÉNYEGE (az iOS-fordítás) előbb fusson, mint a tesztkészlet. Így ha egy teszt
# platformfüggő okból elhasal macOS-en, az nem rejti el az iOS-eredményt.
#
# ⚠️ KÖLTSÉG: a repó **publikus**, ezért a standard GitHub-hosted macOS runner
# **ingyenes** (a 10× szorzó csak fizetős keretnél számítana). Egy futás kb.
# 15-25 perc. Ha a repó valaha privát lesz, a push-triggert érdemes kikapcsolni:
# privátban a macOS-perc tízszeres szorzóval fogy (~200 macOS-perc / hó).

name: iOS fordítás-ellenőrzés

on:
  workflow_dispatch:
  # ⚠️ MIÉRT KELL A `push` IS (mérve): a `workflow_dispatch` „Run workflow"
  # gombot a GitHub csak akkor mutatja, ha a workflow az **alapértelmezett**
  # branch-en is ott van — az pedig ebben a repóban a **`master`**, nem a
  # `codex/v1.0`. Kézi indítás nélkül tehát semmi nem indítaná el.
  # A szűrő szándékosan szűk: csak az iOS-releváns fájlokra indul.
  push:
    branches:
      - codex/v1.0
    paths:
      - 'ios/**'
      # ⚠️ A `lib/**` és a `test/**` AZÉRT kell, mert a telefonos teszthez
      # MINDEN kódváltozásból új IPA kell — enélkül egy Dart-javítás nem
      # indítana buildet, és nem lenne mit újratelepíteni.
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/ios-unsigned-check.yml'

concurrency:
  group: ios-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-unsigned:
    name: analyze + iOS fordítás + teszt
    # A `macos-15` runner Xcode 16.x-et ad, a Flutter 3.47 minimuma Xcode 15,
    # tehát bőven elég. (Feltöltéshez az Apple újabb SDK-t kér — azt a
    # Codemagic végzi, ott a Xcode verziója a codemagic.yaml-ban van.)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Forráskód
        uses: actions/checkout@v4

      - name: Xcode kiválasztása
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Flutter telepítése
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Verziók
        run: |
          flutter --version
          xcodebuild -version

      - name: Függőségek
        run: flutter pub get

      - name: Statikus elemzés
        run: flutter analyze

      - name: iOS fordítás (aláírás nélkül)
        # ⚠️ A `HUHS_APP_CHECK_DEBUG_IOS` azért kell, mert az iOS App Check
        # szolgáltató regisztrálása **Apple Developer fiókot** kér (a DeviceCheck
        # konfighoz `keyId` + `.p8` kötelező), a `debug` szolgáltató viszont
        # fiók nélkül is működik — és pont ez a sideloadolt TESZT-build célja.
        # Az éles iOS build (Codemagic → TestFlight) szándékosan NEM kapja meg
        # ezt a zászlót; ott App Attest a helyes út, regisztrált szolgáltatóval.
        # ⚠️ Az iOS reklám-egységazonosítók **GitHub-változókból** (`vars.*`)
        # jönnek, ezért a bevezetésük NEM kér kódmódosítást: elég a
        # Settings → Secrets and variables → Actions → **Variables** alatt
        # létrehozni a `HUHS_ADMOB_BANNER_ID_IOS` és `HUHS_ADMOB_REWARDED_ID_IOS`
        # változót (a Firebase Console-ból/AdMob-ból kapott `ca-app-pub-…/…`).
        # Ha nincsenek beállítva, az érték **üres string** marad — és pontosan ez a
        # mai, biztonságos viselkedés: az `ad_unit_plan.dart` ilyenkor a Google
        # **hivatalos teszt-egységeire** esik vissza, ezért a reklám így is megjelenik.
        # (Ez a lépés szándékosan a tesztek ELŐTT van — lásd lentebb.)
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=HUHS_APP_CHECK_DEBUG_IOS=true \
            --dart-define=HUHS_ADMOB_BANNER_ID_IOS=${{ vars.HUHS_ADMOB_BANNER_ID_IOS }} \
            --dart-define=HUHS_ADMOB_REWARDED_ID_IOS=${{ vars.HUHS_ADMOB_REWARDED_ID_IOS }}

      # --- Aláírás nélküli IPA a kézi teszteléshez -------------------------
      # Az `.ipa` a valóságban egy zip, benne `Payload/Runner.app` — nincs
      # benne semmi varázslat, és NEM kell hozzá Apple Developer fiók. Ezt a
      # fájlt tölti le a tulajdonos, és a Sideloadly **ingyenes Apple ID-val**
      # aláírja + felrakja a telefonra (7 napos érvényességgel).
      # ⚠️ Ez a lépés SZÁNDÉKOSAN a tesztek ELŐTT van: így a letölthető csomag
      # akkor is elkészül, ha egy teszt elhasal.
      - name: Aláírás nélküli IPA csomagolása
        run: |
          cd build/ios/iphoneos
          rm -rf Payload
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -qr Runner-unsigned.ipa Payload
          ls -lh Runner-unsigned.ipa
          echo "--- a csomag tartalma ---"
          unzip -l Runner-unsigned.ipa | head -5

      - name: Letölthető csomag feltöltése
        uses: actions/upload-artifact@v4
        with:
          name: HUHS-ios-unsigned-ipa
          retention-days: 14
          path: build/ios/iphoneos/Runner-unsigned.ipa

      - name: Tesztek
        run: flutter test
