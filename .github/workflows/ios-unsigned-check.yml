# GitHub Actions — ingyenes iOS-ellenőrzés Apple Developer fiók NÉLKÜL
#
# Mit bizonyít ez a workflow?
#   1. a Dart-kód elemzése tiszta (`flutter analyze`),
#   2. az iOS-projekt LEFORDUL (`flutter build ios --no-codesign`) — vagyis a
#      Podfile, a pluginok és a deployment target rendben vannak,
#   3. a tesztkészlet zöld macOS-en is.
#
# Mit NEM tud? Aláírt .ipa-t és TestFlightot — ahhoz Apple Developer Program
# tagság kell. Az a lépés a Codemagicben van (codemagic.yaml).
#
# SORREND SZÁNDÉKOS: a lépések úgy vannak sorba állítva, hogy a workflow
# LÉNYEGE (az iOS-fordítás) előbb fusson, mint a tesztkészlet. Így ha egy teszt
# platformfüggő okból elhasal macOS-en, az nem rejti el az iOS-eredményt.
#
# ⚠️ KÖLTSÉG: a repó **publikus**, ezért a standard GitHub-hosted macOS runner
# **ingyenes** (a 10× szorzó csak fizetős keretnél számítana). Egy futás kb.
# 15-25 perc. Ha a repó valaha privát lesz, a push-triggert érdemes kikapcsolni:
# privátban a macOS-perc tízszeres szorzóval fogy (~200 macOS-perc / hó).

name: iOS fordítás-ellenőrzés

on:
  workflow_dispatch:
  # ⚠️ MIÉRT KELL A `push` IS (mérve): a `workflow_dispatch` „Run workflow"
  # gombot a GitHub csak akkor mutatja, ha a workflow az **alapértelmezett**
  # branch-en is ott van — az pedig ebben a repóban a **`master`**, nem a
  # `codex/v1.0`. Kézi indítás nélkül tehát semmi nem indítaná el.
  # A szűrő szándékosan szűk: csak az iOS-releváns fájlokra indul.
  push:
    branches:
      - codex/v1.0
    paths:
      - 'ios/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/ios-unsigned-check.yml'

concurrency:
  group: ios-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-unsigned:
    name: analyze + iOS fordítás + teszt
    # A `macos-15` runner Xcode 16.x-et ad, a Flutter 3.47 minimuma Xcode 15,
    # tehát bőven elég. (Feltöltéshez az Apple újabb SDK-t kér — azt a
    # Codemagic végzi, ott a Xcode verziója a codemagic.yaml-ban van.)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Forráskód
        uses: actions/checkout@v4

      - name: Xcode kiválasztása
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Flutter telepítése
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Verziók
        run: |
          flutter --version
          xcodebuild -version

      - name: Függőségek
        run: flutter pub get

      - name: Statikus elemzés
        run: flutter analyze

      - name: iOS fordítás (aláírás nélkül)
        run: flutter build ios --release --no-codesign

      - name: Tesztek
        run: flutter test
