name: hungarian_hardstyle_app
description: "Hungarian Hardstyle mobile application"

publish_to: 'none'

version: 1.0.0+385

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.6.1
  dio: ^5.9.0
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  intl: ^0.20.2
  html: ^0.15.6
  flutter_html: ^3.0.0
  google_fonts: ^6.3.3
  url_launcher: ^6.3.2

  # Spotify Player
  webview_flutter: ^4.13.0
  just_audio: ^0.10.5
  # A háttér-lejátszáshoz (zárképernyő + értesítés-vezérlés): az `audio_service`
  # adja a rendszer médiamunkamenetét, az `audio_session` a hangfókuszt
  # (hívás / más zene-app) — a rádiónál ugyanez kézzel van megírva Kotlinban.
  audio_service: ^0.18.18
  audio_session: ^0.2.4
  image_picker: ^1.2.3
  package_info_plus: ^8.3.0
  shared_preferences: ^2.5.3
  local_auth: ^2.3.0
  google_mobile_ads: ^9.1.0
  # A Firebase-család EGYÜTT lép (a FlutterFire pluginok a _flutterfire_internals
  # csomagon és a Firebase BoM-on osztoznak, ezért részleges emelés nem biztonságos).
  # A 2026-09-24-i emelés oka MÉRT: a firebase-auth 23.2.1 AAR beépített
  # proguard.txt-je `-keep class com.google.android.gms.internal.** { *; }`-t hozott,
  # ami egymaga a blokkolt kód ~40%-át adta (lásd AGENTS.md + tools/analyze-r8-config.mjs).
  firebase_core: ^4.15.0
  firebase_app_check: ^0.4.8
  firebase_messaging: ^16.7.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  google_sign_in: ^6.2.2
  cloud_functions: ^6.5.0
  in_app_purchase: ^3.2.3
  flutter_secure_storage: ^10.3.1
  otp: ^3.2.0
  in_app_update: ^5.0.0
  share_plus: 10.1.4
  app_links: 6.4.1
  app_badge_plus: ^1.3.5
  # A megvĂˇsĂˇrolt zenĂ©k helyi tĂˇrolĂłjĂˇhoz (app-sajĂˇt mappa, nem a kĂ¶zĂ¶s
  # LetĂ¶ltĂ©sek): a â€žSajĂˇt zenĂ©im" lejĂˇtszĂł innen jĂˇtssza le a fĂˇjlokat.
  path_provider: ^2.1.5
  # Mérés és összeomlás-jelentés (2026-09-28). Az `app_analytics.dart` vékony
  # burkoló mögött élnek, hogy a naplózott események **zárt, adatvédelem-barát**
  # halmaza egy helyen legyen számon kérhető (nincs bennük személyes adat).
  firebase_analytics: ^12.6.0
  firebase_crashlytics: ^5.4.0
  # Play-értékelés kérése EGYSZER, egy pozitív pillanatban (lásd
  # `lib/services/app_review_prompt.dart`).
  in_app_review: ^2.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  # A KÜLSŐ MEGNYITÁS helyettesítője a tesztben (2026-09-28): a naptár-export
  # „Google Naptár" ága csak így mérhető meghatározottan (a valódi plugin a
  # teszt-környezetben nem hívható, a válasza pedig platformonként más lenne —
  # az „esetleg" nem bizonyíték).
  url_launcher_platform_interface: ^2.3.2

flutter:
  uses-material-design: true

  assets:
    - assets/logos/
    - assets/images/
    # Az angol felület-szótár (magyar szöveg → angol). Hiányzó kulcsnál a
    # felirat a magyar marad, ezért a szótár bővülhet anélkül, hogy bármi
    # üresen maradna.
    - assets/i18n/
